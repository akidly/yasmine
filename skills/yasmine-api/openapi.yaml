      description: |
        Probe santé pour monitoring / load balancer. **Route interne** —
        pas sous le SLA `/v1/*`, pas de rate-limit, pas d'auth, pas de
        versioning. **Ne pas utiliser pour orchestration billing** ni
        comme signal de disponibilité métier — elle renvoie `200 OK` dès
        que le process Python répond, indépendamment de l'état de la DB
        ou des dépendances externes. Pour connaître l'état métier, se
        reporter à `GET /v1/me` (auth requise).
      responses:
        "200":
          description: Process vivant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /v1/shops/{shop_external_id}/orders:
    post:
      operationId: createOrder
      summary: Déclarer une commande
      tags: [Orders]
      x-status: live
      x-rate-limit: "120/minute"
      description: |
        Déclare une commande sous une boutique, avec **votre** identifiant.
        Minimum : `external_id`, `customer`, `amount`, et de quoi décrire le
        contenu — `items` ou `items_text`.

        Une commande déclarée s'appelle ensuite **par référence** :
        `POST /v1/calls` avec `order_external_id`, et rien d'autre que les
        paramètres de l'appel. Le serveur relit le client, les articles et
        les montants. Relancer le client se fait avec la même référence :
        les appels s'empilent sur la commande, jamais de doublon.

        **Les articles sont figés ici.** Une ligne qui référence un produit
        du catalogue (`product_external_id`, plus `variant_external_id` s'il
        a plusieurs variantes) est résolue à la déclaration — nom, prix,
        variantes, identifiants — et c'est cette copie que chaque appel
        lira, même si le catalogue change ensuite. Une ligne décrite sur
        place avec `name` reste valide : article sur mesure, frais de port,
        cadeau.

        **Le statut ne s'écrit pas.** `order_status` vient du résultat des
        appels : `PENDING`, puis `CONFIRMED`, `CANCELLED`, `UNREACHABLE`…
        Il se lit.

        **Création stricte** : un `external_id` déjà pris dans cette
        boutique renvoie un 409, jamais une mise à jour implicite.
      parameters:
        - $ref: "#/components/parameters/ShopExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderDeclare" }
            examples:
              par_reference:
                summary: Deux articles du catalogue, un client, un montant
                value:
                  external_id: "CMD-2026-8891"
                  customer:
                    name: "Ahmed Bennani"
                    phone_number: "+212612345678"
                  amount: "487.00"
                  delivery_address: "12 rue des Orangers, Casablanca"
                  items:
                    - product_external_id: "TSHIRT-BLANC"
                      variant_external_id: "TSH-XL"
                      quantity: 1
                    - product_external_id: "SERUM-VITC"
                      quantity: 1
              avec_frais_de_port:
                summary: Un article du catalogue et une ligne décrite sur place
                value:
                  external_id: "CMD-2026-8892"
                  customer:
                    name: "Salma Idrissi"
                    phone_number: "+212661234567"
                    gender: "female"
                  amount: "179.00"
                  shipping_cost: "30.00"
                  estimated_delivery_date: "2026-09-05"
                  order_notes: "Cadeau : ne pas mentionner le prix"
                  items:
                    - product_external_id: "TSHIRT-BLANC"
                      variant_external_id: "TSH-M"
                      quantity: 1
                    - name: "Frais de livraison"
                      quantity: 1
                      unit_price: "30.00"
      responses:
        "201":
          description: Commande déclarée, articles figés.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ShopNotFound" }
        "409":
          description: |
            `external_id` déjà utilisé dans cette boutique
            (`order_external_id_already_exists`).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            Payload invalide (`validation_error`) : champ manquant, trop
            long, chaîne vide, champ inconnu, ni `items` ni `items_text`.
            Ou une ligne qui référence un produit inconnu
            (`order_item_unknown_product`) ou une variante non précisée
            (`order_item_variant_required`, le `detail` liste celles qui
            existent).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

    get:
